<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Drawstring mat vs three-sided zip tray</title>
  <desc id="desc">Editorial structure comparison for AiComparor makeup bag guide hero</desc>
  <rect width="1200" height="675" fill="#F7F5F2"/>
  <!-- eyebrow -->
  <text x="600" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="4" fill="#3D2B1F">STRUCTURE EDIT</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1A1A1A">Two ways to open. Two ways to work.</text>

  <!-- LEFT: Drawstring mat -->
  <g transform="translate(120,160)">
    <text x="220" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1A1A1A">Drawstring mat</text>
    <text x="220" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5C5C5C">Pulls open flat into a soft circle</text>
    <!-- mat circle -->
    <circle cx="220" cy="200" r="130" fill="#EDE8E2" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="220" cy="200" r="118" fill="none" stroke="#3D2B1F" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>
    <!-- drawstrings -->
    <path d="M95 175 C60 160, 40 140, 50 110" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="105" r="6" fill="#3D2B1F"/>
    <path d="M345 175 C380 160, 400 140, 390 110" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="390" cy="105" r="6" fill="#3D2B1F"/>
    <!-- brushes on mat -->
    <g transform="translate(150,155)" stroke="#1A1A1A" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="10" height="70" rx="2" fill="#EDE8E2"/>
      <ellipse cx="5" cy="-8" rx="8" ry="12" fill="#C4B5A5" stroke="#1A1A1A"/>
      <rect x="28" y="10" width="8" height="55" rx="2" fill="#EDE8E2"/>
      <ellipse cx="32" cy="2" rx="7" ry="10" fill="#C4B5A5" stroke="#1A1A1A"/>
      <rect x="52" y="18" width="7" height="45" rx="2" fill="#EDE8E2"/>
      <ellipse cx="55.5" cy="10" rx="6" ry="9" fill="#C4B5A5" stroke="#1A1A1A"/>
      <circle cx="100" cy="50" r="14" fill="#F7F5F2" stroke="#1A1A1A"/>
      <circle cx="130" cy="70" r="11" fill="#F7F5F2" stroke="#1A1A1A"/>
    </g>
    <text x="220" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5C5C5C">Light · flexible · layover workspace</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="150" x2="600" y2="560" stroke="#E5E1DB" stroke-width="1"/>
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#3D2B1F">vs</text>

  <!-- RIGHT: Three-sided zip tray -->
  <g transform="translate(640,160)">
    <text x="220" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1A1A1A">Three-sided zip tray</text>
    <text x="220" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5C5C5C">Zips up three sides; opens like a tray</text>
    <!-- tray body isometric-ish flat -->
    <path d="M70 120 L370 120 L370 300 L70 300 Z" fill="#EDE8E2" stroke="#1A1A1A" stroke-width="2"/>
    <!-- open lid / flap back -->
    <path d="M70 120 L90 70 L350 70 L370 120" fill="#F7F5F2" stroke="#1A1A1A" stroke-width="2"/>
    <!-- three-side zipper path on U -->
    <path d="M78 128 L78 292 L362 292 L362 128" fill="none" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- zipper pulls -->
    <circle cx="78" cy="128" r="5" fill="#3D2B1F"/>
    <circle cx="362" cy="128" r="5" fill="#3D2B1F"/>
    <!-- compartments -->
    <line x1="220" y1="140" x2="220" y2="280" stroke="#1A1A1A" stroke-width="1" opacity="0.35"/>
    <line x1="90" y1="210" x2="350" y2="210" stroke="#1A1A1A" stroke-width="1" opacity="0.35"/>
    <!-- upright brushes in left bay -->
    <g transform="translate(110,150)" stroke="#1A1A1A" stroke-width="1.5">
      <rect x="0" y="20" width="8" height="50" rx="2" fill="#EDE8E2"/>
      <ellipse cx="4" cy="12" rx="7" ry="10" fill="#C4B5A5"/>
      <rect x="22" y="10" width="8" height="60" rx="2" fill="#EDE8E2"/>
      <ellipse cx="26" cy="2" rx="7" ry="10" fill="#C4B5A5"/>
      <rect x="44" y="25" width="7" height="45" rx="2" fill="#EDE8E2"/>
      <ellipse cx="47.5" cy="17" rx="6" ry="9" fill="#C4B5A5"/>
      <rect x="64" y="15" width="8" height="55" rx="2" fill="#EDE8E2"/>
      <ellipse cx="68" cy="7" rx="7" ry="10" fill="#C4B5A5"/>
    </g>
    <!-- pots in right bay -->
    <g transform="translate(250,230)" fill="#F7F5F2" stroke="#1A1A1A" stroke-width="1.5">
      <circle cx="20" cy="20" r="16"/>
      <circle cx="60" cy="20" r="13"/>
      <rect x="85" y="8" width="28" height="28" rx="3"/>
    </g>
    <text x="220" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5C5C5C">Structured · secure · upright tools</text>
  </g>

  <text x="600" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#5C5C5C">AICOMPAROR · EDITORIAL STRUCTURE</text>
</svg>
